[project]
name = "facts-extractor"
version = "0.1.0"
description = "Evidence-first fact knowledge layer for PDFs"
requires-python = ">=3.12"
dependencies = [
  "aiofiles>=24.1.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.116.0",
  "httpx>=0.28.1",
  "pgvector>=0.4.1",
  "pydantic-settings>=2.10.0",
  "pymupdf>=1.26.0",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.41",
  "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
