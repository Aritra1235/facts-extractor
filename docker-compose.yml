x-api-environment: &api-environment
  DATABASE_URL: postgresql+asyncpg://facts:facts@db:5432/facts
  UPLOAD_DIR: /data/uploads
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1.0}
  WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
  PARSER_VERSION: ${PARSER_VERSION:-pymupdf-1}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
  LLM_PROVIDER: openrouter
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_TEXT_MODEL: ${OPENROUTER_TEXT_MODEL:-}
  OPENROUTER_EMBEDDING_MODEL: ${OPENROUTER_EMBEDDING_MODEL:-}
  OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://localhost:3000}
  OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Facts Store}
  OPENROUTER_TIMEOUT_MS: ${OPENROUTER_TIMEOUT_MS:-60000}
  OPENROUTER_RETRY_ATTEMPTS: ${OPENROUTER_RETRY_ATTEMPTS:-3}
  FACT_EXTRACTION_CONCURRENCY: ${FACT_EXTRACTION_CONCURRENCY:-3}
  FACT_EXTRACTION_PAGE_BATCH_SIZE: ${FACT_EXTRACTION_PAGE_BATCH_SIZE:-4}
  FACTS_PER_PAGE_LIMIT: ${FACTS_PER_PAGE_LIMIT:-8}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-90}
  EMBEDDING_ITEMS_PER_MINUTE: ${EMBEDDING_ITEMS_PER_MINUTE:-90}
  CANDIDATES_PER_FACT: ${CANDIDATES_PER_FACT:-8}
  MIN_CANDIDATE_SIMILARITY: ${MIN_CANDIDATE_SIMILARITY:-0.55}
  MIN_LLM_RELATIONSHIP_SIMILARITY: ${MIN_LLM_RELATIONSHIP_SIMILARITY:-0.82}
  MAX_LLM_RELATIONSHIPS_PER_DOCUMENT: ${MAX_LLM_RELATIONSHIPS_PER_DOCUMENT:-12}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: facts
      POSTGRES_USER: facts
      POSTGRES_PASSWORD: facts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facts -d facts"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./apps/api
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8000"
    volumes:
      - uploads:/data/uploads

  worker:
    build: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: ./apps/web
      args:
        API_ORIGIN: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  uploads:
